name: App testing

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.sha }}
  cancel-in-progress: ${{ !contains(github.ref, 'master') }}

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Lint code
        run: bash ./gradlew lint --stacktrace
      - name: Unit tests
        run: bash ./gradlew testDebugUnitTest --stacktrace
  apk:
    name: Generate APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Build APKs
        run: bash ./gradlew assembleDebug assembleRelease --stacktrace
      - name: Upload debug APK
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: debug
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
      - name: Sign Release APK
        if: ${{ env.KEYSTORE_B64 != '' && github.event_name != 'pull_request' }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          APK_PATH="app/build/outputs/apk/release/app-release-unsigned.apk"
          ZIPALIGN=$(find $ANDROID_HOME -name zipalign | head -n 1)
          APKSIGNER=$(find $ANDROID_HOME -name apksigner | head -n 1)
          $ZIPALIGN -v -p 4 $APK_PATH app-release-aligned.apk
          $APKSIGNER sign --ks release.keystore --ks-key-alias $KEY_ALIAS --ks-pass pass:$STORE_PASSWORD --key-pass pass:$KEY_PASSWORD --out app-release-signed.apk app-release-aligned.apk
          mv app-release-signed.apk $APK_PATH

      - name: Upload release APK
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          archive: false
